[project]
name = "mini-jarvis-api"
version = "1.0.0"
description = "FastAPI backend for Mini JARVIS"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "openai==1.76.0",
    "httpx==0.28.1",
    "pydantic-settings==2.8.1",
    "pydantic==2.13.5",
    "python-dotenv==1.1.0",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["frontend", "frontend.*", "tests", "tests.*"]
